<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>모두의 승주</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #FBE7EC; touch-action: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #FBE7EC; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 background: #FBE7EC; font-family: sans-serif; color: #4A2C2A; z-index: 10; }
      #loading h1 { margin: 0 0 6px; font-size: 44px; color: #E0628F; letter-spacing: 2px; text-shadow: 0 3px 0 #fff; }
      #loading p { margin: 0 0 22px; font-size: 16px; color: #8C6F68; }
      #bar { width: 260px; height: 14px; border-radius: 7px; background: #F5D9E1; overflow: hidden; }
      #fill { width: 0%; height: 100%; border-radius: 7px; background: #F27BA3; transition: width 0.2s; }
      #hint { margin-top: 18px; font-size: 13px; color: #B8A39B; }
      #error { display: none; margin-top: 18px; padding: 10px 16px; border-radius: 10px; background: #fff; color: #E0628F; font-size: 14px; max-width: 80%; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <h1>모두의 승주</h1>
      <p>~ 폭풍을 부르는 승주 ~</p>
      <div id="bar"><div id="fill"></div></div>
      <div id="hint">불러오는 중… 휴대폰은 가로로 돌려서 플레이해 주세요</div>
      <div id="error"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "VisualNovel",
        productVersion: "1.0",
        // 폰에서 너무 높은 해상도로 그리면 느려지므로 최대 2배까지만
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === 'error') showError(msg); }
      };

      function showError(msg) {
        var e = document.querySelector("#error");
        e.style.display = "block";
        e.textContent = msg;
      }

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
        }).catch(function (message) {
          showError(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
